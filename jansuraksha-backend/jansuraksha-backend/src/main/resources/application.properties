spring.application.name=jansuraksha-backend

server.port=${PORT:8080}


# ==========================================
# MYSQL DATABASE (Environment variable aware)
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jansuraksha?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Vishnu@#$123}


# ==========================================
# JPA / HIBERNATE/
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 6 automatically detects MySQL
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# TWILIO (Optional Live SMS/WhatsApp)
# ==========================================

twilio.account-sid=${TWILIO_ACCOUNT_SID:NONE}
twilio.auth-token=${TWILIO_AUTH_TOKEN:NONE}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:NONE}


# ==========================================
# FAST2SMS OTP
# ==========================================

fast2sms.api-key=${FAST2SMS_API_KEY:YOUR_FAST2SMS_API_KEY}
fast2sms.otp-id=${FAST2SMS_OTP_ID:YOUR_FAST2SMS_OTP_TEMPLATE_ID}


# ==========================================
# JACKSON
# ==========================================

spring.jackson.serialization.fail-on-empty-beans=false
