spring.application.name=jansuraksha-backend

server.port=${PORT:8080}


# ==========================================
# MYSQL DATABASE (Environment variable aware)
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jansuraksha?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}


# ==========================================
# JPA / HIBERNATE/
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 6 automatically detects MySQL
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# TWILIO
# ==========================================



# ==========================================
# FAST2SMS OTP
# ==========================================

fast2sms.api-key=YOUR_FAST2SMS_API_KEY
fast2sms.otp-id=YOUR_FAST2SMS_OTP_TEMPLATE_ID


# ==========================================
# JACKSON
# ==========================================

spring.jackson.serialization.fail-on-empty-beans=false
